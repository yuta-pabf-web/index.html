<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>送信完了｜料理・自炊に関するアンケート</title>
<style>
:root{--bg:#f7f4f1;--paper:#fffdfb;--ink:#2b2928;--muted:#746f6b;--line:#e7ded8;--brand:#c9847d;--brand-dark:#a85e58;--brand-soft:#f5e6e2;--shadow:0 18px 50px rgba(73,54,45,.08)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 0%,rgba(201,132,125,.12),transparent 28rem),radial-gradient(circle at 90% 25%,rgba(138,165,141,.10),transparent 26rem),var(--bg)}
.card{width:min(620px,100%);padding:52px 28px;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.check{width:68px;height:68px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:#eaf3eb;color:#52735b;font-size:32px}
.tag{display:inline-block;margin-bottom:8px;padding:4px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);font-size:11px;font-weight:800;letter-spacing:.06em}
h1{margin:0 0 10px;font-size:clamp(24px,5vw,30px)}
p{margin:0;color:var(--muted);line-height:1.8}
a{display:inline-block;margin-top:26px;padding:13px 24px;border-radius:14px;background:var(--brand);color:#fff;text-decoration:none;font-weight:800}
a:hover{background:var(--brand-dark)}
</style>
</head>
<body>
<main class="card">
  <div class="check">✓</div>
  <div class="tag">送信完了</div>
  <h1>アンケートの送信が完了しました</h1>
  <p>ご回答いただきありがとうございました。<br>いただいた内容は、今後のサービス検証に活用させていただきます。</p>
  <a href="survey-v2.html">アンケートの最初の画面に戻る</a>
</main>
</body>
</html>
