<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>申込完了｜パフキッチン 第2回実証実験</title>
<style>
:root{--ink:#302827;--muted:#746966;--rose:#b96663;--cream:#fff8f5;--line:#ead8d3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#fffaf8,#fff 60%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.75}
.card{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:38px 28px;text-align:center;box-shadow:0 18px 55px rgba(62,38,31,.09)}
.check{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:var(--cream);color:var(--rose);font-size:38px;font-weight:900;border:1px solid var(--line)}
.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--cream);color:var(--rose);font-size:12px;font-weight:900;margin-bottom:10px}h1{font-size:clamp(28px,6vw,42px);line-height:1.25;margin:0 0 14px}p{color:var(--muted);margin:0 auto 18px;max-width:500px}.info{background:#fff8f5;border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink);font-size:14px;margin:20px 0}.btn{display:inline-block;background:var(--rose);color:#fff;text-decoration:none;border-radius:14px;padding:13px 20px;font-weight:900}.small{font-size:11px;color:#9c8d89;margin-top:20px}
</style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <div class="tag">申込完了</div>
    <h1>お申し込みありがとうございます！</h1>
    <p>パフキッチン 第2回実証実験への参加申込を受け付けました。</p>
    <div class="info"><strong>開催日：8月24日（月）</strong><br>会場・正式な時間帯は現在調整中です。確定次第、申込時のメールアドレスへご案内します。</div>
    <a class="btn" href="poc2.html">募集ページに戻る</a>
    <div class="small">PABF株式会社｜PABF KITCHEN</div>
  </main>
</body>
</html>
